[package]
name = "vaultpow"
version = "0.1.3"
edition = "2021"
authors = ["Koray Koska"]
description = "kubectx-style context switcher for HashiCorp Vault"
license = "MIT"
repository = "https://github.com/koraykoska/vaultpow"
readme = "README.md"
keywords = ["vault", "hashicorp", "cli", "kubectx", "context"]
categories = ["command-line-utilities"]

[[bin]]
name = "vaultpow"
path = "src/main.rs"

[dependencies]
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
dialoguer   = "0.11"
reqwest     = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword   = "7"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
shell-escape = "0.1"
url         = "2"

[dev-dependencies]
assert_cmd  = "2"
predicates  = "3"
tempfile    = "3"

[profile.release]
lto         = true
codegen-units = 1
strip       = true
opt-level   = "z"
